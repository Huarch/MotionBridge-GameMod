name: Bug report / Mod 故障
description: Report game crashes, recognition failures, or missing motion streams / 报告游戏崩溃、识别失败或骨骼流中断
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Fallen Doll UE4SS Mod. Disable physical-device output in Motion Bridge before reproducing a crash or motion problem.

        感谢协助改进 Fallen Doll UE4SS Mod。复现崩溃或动作问题前，请先在 Motion Bridge 中关闭实体设备输出。

  - type: dropdown
    id: mod_version
    attributes:
      label: Mod version / Mod 版本
      options:
        - v0.17.0
        - Newer development build / 更新的开发版本
        - Older version / 旧版本
        - Unknown / 不清楚
    validations:
      required: true

  - type: dropdown
    id: game_build
    attributes:
      label: Game build / 游戏版本
      options:
        - Playtest / Closed Beta
        - Legacy 0.49
        - Steam Demo
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: display_mode
    attributes:
      label: Display mode / 显示模式
      options:
        - Desktop / 桌面
        - VR
        - Both / 两者都会
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened? / 问题描述
      description: Include what you saw in the game and the Motion Bridge stream status. / 说明游戏画面及 Motion Bridge 数据流状态。
      placeholder: Expected result / 预期结果：

        Actual result / 实际结果：
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Start Motion Bridge
        2. Start the game and enter ...
        3. Switch to ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: action
    attributes:
      label: Character and HAnime / 角色与 HAnime
      description: Give the visible character and pose/action name. Montage names are welcome but not required. / 填写画面中的角色和姿势名称；不强制要求 Montage 名称。
      placeholder: Alet — Hand02

  - type: dropdown
    id: device_output
    attributes:
      label: Device output / 设备输出
      options:
        - Disabled; Live Preview only / 已关闭，仅预览
        - USB
        - Wi-Fi
        - Not applicable / 不相关
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots / 日志与截图
      description: Drag relevant UE4SS and Motion Bridge logs or screenshots here. Remove API keys, passwords, private paths, and device identifiers first. / 可拖入相关 UE4SS、Motion Bridge 日志或截图；请先移除 API Key、密码、隐私路径和设备标识。

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 提交前检查
      options:
        - label: I reproduced the problem with physical-device output disabled. / 我已在关闭实体设备输出时复现问题。
          required: true
        - label: I searched existing issues for the same problem. / 我已搜索是否存在相同 Issue。
          required: true

